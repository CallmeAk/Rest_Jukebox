name: CI
on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: node --check js/store.js && node --check js/core.js && node --check js/app.js
      - name: Core flow tests
        run: node tests/core.test.js
